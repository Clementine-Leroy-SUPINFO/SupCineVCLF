<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/img/logoBgcBlack.svg" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <title>Rechercher un film</title>
</head>
<body>
    <header id="header"></header>
    <main>
        <section class="container">
                <h1>Rechercher un film</h1>

                <div class="containerSearch">
                    <label for="searchBar">Entrer le titre du film recherché</label>
                    <input id="searchBar" type="search" placeholder="Guardians of the Galaxy" aria-label="Rechercher un film" />
                </div>
            <ul>
                <li data-movieCardContainer></li>
            </ul>

            <template>
                    <div class="movieCard">
                        <div class="posterCard"></div>
                        <div class="headerCard"></div>
                        <div class="bodyCard"></div>
                    </div>
            </template>



        </section>


        <!--Pour charger plus de résultats, copier le bouton de Victor pour plus de cohérence-->
    </main>
    <footer id="footer"></footer>
    <script src="assets/components/header.js"></script>
    <script src="assets/components/footer.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
