<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/img/logoBgcBlack.svg" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <title>Rechercher un film</title>
</head>
<body>
    <header id="header"></header>
    <main>
        <section class="container">
                <h1>Rechercher un film</h1>

                <div class="containerSearch">
                    <form data-searchForm>
                    <label for="searchBar">Entrer le titre du film recherché </label>
                    <input id="searchBar" type="search" data-searchInput placeholder="Guardians of the Galaxy"/>
                    </form>
                </div>
                <p data-resultCount></p>
                <p data-message hidden></p>
            <div data-movieCardContainer></div>
            <button data-loadMore hidden>charger plus</button>
        </section>

        <!--Pour charger plus de résultats, copier le bouton de Victor pour plus de cohérence-->
    </main>
    <footer id="footer"></footer>
    <script src="assets/components/header.js"></script>
    <script src="assets/components/footer.js"></script>
    <script type="module" src="assets/js/search.js"></script>
</body>
</html>
